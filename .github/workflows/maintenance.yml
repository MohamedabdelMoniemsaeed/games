name: Android App Maintenance - Safe Updates, Quality Gates and Tests

on:
  schedule:
    - cron: "0 7 * * 5" # Friday 09:00 Egypt time (UTC+2) = 07:00 UTC
  workflow_dispatch:
    inputs:
      update_track:
        description: "Select the dependency update track"
        required: true
        type: choice
        default: safe
        options:
          - safe
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: android-maintenance-${{ github.workflow }}-${{ inputs.update_track || 'safe' }}
  cancel-in-progress: true

jobs:
  maintenance-and-test:
    name: Dependency Upgrade, Test & Android Verification
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Record Node, NPM and Java versions
        run: |
          node --version
          npm --version
          java -version

      - name: Install dependencies
        id: deps_install
        run: npm install

      - name: Safe dependency upgrade
        if: github.event_name != 'workflow_dispatch' || inputs.update_track == 'safe'
        run: npm update --save

      - name: Major dependency upgrade
        if: github.event_name == 'workflow_dispatch' && inputs.update_track == 'major'
        run: npx npm-check-updates -u && npm install

      - name: Type checking and static analysis
        id: analyze
        continue-on-error: true
        run: npm run lint

      - name: Run Automated Unit Tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Build Web Production Assets
        id: build_web
        continue-on-error: true
        run: npm run build

      - name: Sync Capacitor Android Project
        id: sync_android
        continue-on-error: true
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Verify Android Gradle Build
        id: build_android
        continue-on-error: true
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Determine Pipeline Status
        id: status
        if: always()
        env:
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD_WEB: ${{ steps.build_web.outcome }}
          SYNC_ANDROID: ${{ steps.sync_android.outcome }}
          BUILD_ANDROID: ${{ steps.build_android.outcome }}
        run: |
          echo "Analysis: $ANALYZE"
          echo "Tests: $TESTS"
          echo "Web Build: $BUILD_WEB"
          echo "Android Sync: $SYNC_ANDROID"
          echo "Android Build: $BUILD_ANDROID"

          if [ "$ANALYZE" = "success" ] &&
             [ "$TESTS" = "success" ] &&
             [ "$BUILD_WEB" = "success" ] &&
             [ "$SYNC_ANDROID" = "success" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "note=All required quality gates and tests passed." >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "note=One or more quality gates failed. Manual review required." >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes if gates passed
        if: always() && steps.status.outputs.proceed == 'true'
        env:
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Android dependencies, tests and assets" || true
            git push origin HEAD:${GITHUB_BRANCH}
          fi
